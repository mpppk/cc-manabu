name: Chrome PWA probe
on:
  push:
    branches: [claude/issue-140-chrome-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Load the proposed code
        run: |
          git fetch --depth=1 origin 668c689247f7e2de18609af132cb2ce37fe62f1e
          git checkout FETCH_HEAD -- src test bunfig.toml
      - run: bun .github/chrome-pwa-probe.ts
